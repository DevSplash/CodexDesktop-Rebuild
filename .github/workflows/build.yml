name: Build & Release (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: false
        default: "all"
        type: choice
        options: [all, mac, windows, linux]

env:
  NODE_VERSION: "24"

jobs:
  resolve_codex_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve latest stable openai/codex release
        id: release
        shell: bash
        run: |
          TAG="$(curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: CodexDesktop-Rebuild' \
            https://api.github.com/repos/openai/codex/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using openai/codex $TAG"

  build-mac:
    needs: resolve_codex_release
    if: inputs.platform == 'all' || inputs.platform == 'mac'
    runs-on: macos-latest
    env:
      OPENAI_CODEX_RELEASE_TAG: ${{ needs.resolve_codex_release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - run: |
          brew install --quiet sevenzip
      - run: node scripts/sync-upstream.js --force --skip-win
      - run: node scripts/patch-all.js mac-${{ matrix.arch }}
      - run: npm run build:mac-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-macOS-${{ matrix.arch }}
          path: out/*.dmg

  build-windows:
    needs: resolve_codex_release
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      OPENAI_CODEX_RELEASE_TAG: ${{ needs.resolve_codex_release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - run: |
          choco install 7zip -y
      - name: Add 7zz alias
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "C:\Program Files\7-Zip\7zz.exe"
          echo "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: node scripts/sync-upstream.js --force --skip-mac
      - run: node scripts/patch-all.js win
      - run: npm run build:win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-Windows-x64
          path: out/*.zip

  build-linux:
    needs: resolve_codex_release
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      OPENAI_CODEX_RELEASE_TAG: ${{ needs.resolve_codex_release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: |
          npm ci --ignore-scripts
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg 7zip
      - run: node scripts/sync-upstream.js --force --skip-win
      - run: node scripts/patch-all.js mac-${{ matrix.arch }}
      - run: npm run build:linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: Codex-Linux-${{ matrix.arch }}
          path: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
